name: c-utils CI

# Pushes to main, and to verify/* branches for checking work before it lands
# on main, run the gate tier. The deep tier (Cerberus, Valgrind, fuzzing,
# CBMC) runs nightly at 06:00 UTC and by hand, and keeps the "Nightly
# findings" issue (ci/README.md).
on:
  push:
    branches: [main, 'verify/**']
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# One group per event, so a push never cancels a nightly run or the reverse;
# ci/verify.sh's lock runs them one at a time on the runner.
concurrency:
  group: c-utils-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pushes and manual runs must come from the trusted actor. Gitea does not
    # attribute a scheduled run to a pusher, so its actor proves nothing; a
    # schedule runs only the workflow committed on the default branch, which
    # already takes repository write access to change, so the repository
    # match alone admits it.
    if: >-
      vars.CUTILS_CI_REPOSITORY != '' &&
      github.repository == vars.CUTILS_CI_REPOSITORY &&
      (github.event_name == 'schedule' ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.CUTILS_CI_ACTOR != '' &&
      github.actor == vars.CUTILS_CI_ACTOR))
    runs-on: ${{ vars.CUTILS_CI_RUNNER }}
    # A deep run (at most 40 minutes), or a gate run waiting behind one.
    timeout-minutes: 90
    env:
      CUTILS_CI_API_LOGIN: ${{ vars.CUTILS_CI_API_LOGIN }}
      CUTILS_CI_TOOLCHAIN_REPOSITORY: ${{ vars.CUTILS_CI_TOOLCHAIN_REPOSITORY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: dcheck gate against the pinned toolchain
        if: github.event_name == 'push'
        run: bash ci/verify.sh gate
      - name: make deep against the pinned toolchain, and the findings issue
        if: github.event_name != 'push'
        run: bash ci/verify.sh deep
      - name: Keep the logs on pass or failure
        if: always()
        # v3.1.3, as cgrep's runner validated; v4 needs a newer runner.
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32
        with:
          name: ${{ github.event_name }}-${{ github.sha }}-${{ github.run_id }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 30
