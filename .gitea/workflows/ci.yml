name: c-utils deep

# main, and verify/* branches for checking work before it lands on main.
on:
  push:
    branches: [main, 'verify/**']

concurrency:
  group: c-utils-deep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep:
    if: >-
      github.event_name == 'push' &&
      vars.CUTILS_CI_REPOSITORY != '' &&
      vars.CUTILS_CI_ACTOR != '' &&
      github.repository == vars.CUTILS_CI_REPOSITORY &&
      github.actor == vars.CUTILS_CI_ACTOR
    runs-on: ${{ vars.CUTILS_CI_RUNNER }}
    timeout-minutes: 45
    env:
      CUTILS_CI_API_LOGIN: ${{ vars.CUTILS_CI_API_LOGIN }}
      CUTILS_CI_TOOLCHAIN_REPOSITORY: ${{ vars.CUTILS_CI_TOOLCHAIN_REPOSITORY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: make deep against the pinned toolchain
        run: bash ci/verify.sh
      - name: Keep the logs on pass or failure
        if: always()
        # v3.1.3, as cgrep's runner validated; v4 needs a newer runner.
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32
        with:
          name: deep-${{ github.sha }}-${{ github.run_id }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 30
