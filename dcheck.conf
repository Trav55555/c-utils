SRC_DIR=src
TEST_DIR=tests
INCLUDE_DIR=include
# cu_dir.c needs DT_* and cu_socket.c uses atomic Linux descriptor creation.
# dcheck force-includes a header, so feature defines must be passed here.
PROJECT_DEFINES="_DEFAULT_SOURCE _GNU_SOURCE"
FUZZ_DIR=fuzz
PROOF_DIR=proofs
COVERAGE_MIN=90
FUZZ_SECONDS=10
REGIONS_CHECK=1
# cu_arena_grow may realloc the arena's newest block (grow_head), and realloc
# has no regions model, so the block, the arena's own storage, goes where
# regions cannot follow. Only a block holding p alone, made under the
# innermost scope, is reallocated, and nothing but a->head points at it; the
# growth paths are tested in tests/test_arena.c.
REGIONS_ACCEPT=cu_arena_grow:rg-contract-drift
