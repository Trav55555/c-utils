SRC_DIR=src
TEST_DIR=tests
INCLUDE_DIR=include
# cu_dir.c needs POSIX 2008 and the DT_* kinds; dcheck force-includes a
# header before any source, so the define has to come from here.
PROJECT_DEFINES=_DEFAULT_SOURCE
FUZZ_DIR=fuzz
PROOF_DIR=proofs
COVERAGE_MIN=90
FUZZ_SECONDS=10
REGIONS_CHECK=1
# cu_arena_grow copies p's bytes into a fresh push in the same arena, and p
# is a void *, so regions must treat the copy as a store of a's storage into
# a's storage, which it cannot tell from storing an inner scope's pointer
# into an older object. The copy runs only toward newer storage, and the
# growth paths are tested in tests/test_arena.c.
REGIONS_ACCEPT=cu_arena_grow:rg-contract-drift
